<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>英単語クラフト</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛏️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#2a2622; --bg2:#35302b; --panel:#efe6d6; --panel2:#e2d6c1; --ink:#221d18; --ink-soft:#6b5f52;
  --on-dark:#f3ece0; --on-dark-soft:#bfb3a2; --edge:#14110e;
  --stone:#8d8f94; --stone-d:#6e7075; --dirt:#8a5f3d; --dirt-d:#6c4a2f; --grass:#5fa045;
  --copper:#d0814a; --iron:#ddd6cb; --gold:#f2c230; --ruby:#e0405a;
  --ok:#5fbf6a; --miss:#e5484d;
  --display:"DotGothic16","Hiragino Kaku Gothic ProN","Yu Gothic",monospace;
  --body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){ --bg:#3a342e; --bg2:#463f37; }
}
:root[data-theme="light"]{ --bg:#3a342e; --bg2:#463f37; }
:root[data-theme="dark"]{ --bg:#2a2622; --bg2:#35302b; }
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--on-dark);font-family:var(--body);font-weight:500;line-height:1.6}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:18px 16px 40px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-family:var(--display);font-weight:400;font-size:clamp(28px,4.4vw,40px);margin:0;line-height:1.15}
.logo small{display:block;font-family:var(--body);font-size:14px;color:var(--on-dark-soft)}
.ghost{background:transparent;border:2px solid var(--on-dark-soft);border-radius:4px;padding:6px 12px;font-size:14px}
.note{font-size:14px;color:var(--on-dark-soft);margin:6px 0 0}

/* base (拠点) */
.base{margin-top:16px;background:linear-gradient(#6fa9d6,#a9d3ef 70%);border:3px solid var(--edge);border-radius:4px;overflow:hidden;position:relative}
.base-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;background:rgba(20,17,14,.55)}
.base-head h2{font-family:var(--display);font-weight:400;font-size:20px;margin:0}
.base-head .prog{font-size:14px;color:var(--on-dark)}
.grid{display:grid;grid-template-columns:repeat(64,1fr);grid-template-rows:repeat(16,1fr);aspect-ratio:64/16;width:100%}
.cell{width:100%;height:100%}
.cell{position:relative}
.cell.plan{outline:1px dashed rgba(255,255,255,.35);outline-offset:-2px}
.cell.on{box-shadow:inset -2px -2px 0 rgba(0,0,0,.25),inset 2px 2px 0 rgba(255,255,255,.18)}
.cell.new{animation:pop .5s}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.inv{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.ore{display:flex;align-items:center;gap:6px;background:var(--bg2);border:2px solid var(--edge);border-radius:4px;padding:4px 10px;font-family:var(--display);font-size:16px}
.ore i{width:16px;height:16px;display:inline-block;border:2px solid var(--edge)}

/* mine map */
.layer{margin-top:22px;border:3px solid var(--edge);border-radius:4px;overflow:hidden}
.layer-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;padding:10px 14px;background:var(--bg2)}
.layer-head h2{font-family:var(--display);font-weight:400;font-size:21px;margin:0}
.layer-head .stars{font-family:var(--display);font-size:17px}
.shafts{display:flex;gap:10px;padding:18px 12px 16px;overflow-x:auto;
  background-color:var(--dirt-d);
  background-image:linear-gradient(45deg,rgba(0,0,0,.12) 25%,transparent 25% 75%,rgba(0,0,0,.12) 75%),linear-gradient(45deg,rgba(0,0,0,.12) 25%,transparent 25% 75%,rgba(0,0,0,.12) 75%);
  background-size:24px 24px;background-position:0 0,12px 12px}
.node{flex:1;min-width:96px;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0}
.blk{width:100%;max-width:110px;aspect-ratio:1/1;border:3px solid var(--edge);position:relative;
  background-color:var(--stone);
  background-image:linear-gradient(var(--ore,transparent),var(--ore,transparent)),linear-gradient(var(--ore,transparent),var(--ore,transparent)),linear-gradient(var(--ore,transparent),var(--ore,transparent)),linear-gradient(var(--ore,transparent),var(--ore,transparent)),linear-gradient(135deg,rgba(255,255,255,.12),rgba(0,0,0,.18));
  background-size:12% 12%,10% 10%,12% 12%,9% 9%,100% 100%;background-position:16% 18%,84% 22%,22% 84%,80% 80%,0 0;background-repeat:no-repeat;
  box-shadow:inset -6px -6px 0 rgba(0,0,0,.25),inset 6px 6px 0 rgba(255,255,255,.15);
  display:flex;align-items:center;justify-content:center;transition:transform .12s}
.node:hover .blk{transform:translateY(-4px)}
.blk b{font-family:var(--display);font-weight:400;font-size:24px;color:#fff;text-shadow:2px 2px 0 var(--edge)}
.node .lbl{font-size:13px;font-weight:700;color:var(--on-dark);text-align:center;line-height:1.25}
.node .st{font-size:13px;letter-spacing:1px;color:var(--gold);height:18px}
.layer.locked{opacity:.6}
.layer.locked .lock{padding:12px 14px;font-size:14px;color:var(--on-dark-soft);background:var(--bg2);border-top:2px solid var(--edge)}
.legend{margin-top:14px;font-size:13px;color:var(--on-dark-soft)}

/* modal */
.modal{position:fixed;inset:0;background:rgba(8,6,4,.65);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal.on{display:flex}
.sheet{background:var(--panel);color:var(--ink);border:3px solid var(--edge);border-radius:4px;max-width:580px;width:100%;max-height:90%;overflow:auto;padding:20px;box-shadow:inset -5px -5px 0 var(--panel2)}
.sheet h3{font-family:var(--display);font-weight:400;font-size:24px;margin:0}
.sheet .sub{color:var(--ink-soft);font-size:14px;margin:2px 0 14px}
.levels{display:grid;gap:8px}
.lv{display:grid;grid-template-columns:56px 1fr auto;align-items:center;gap:12px;text-align:left;background:#fffaf0;border:2px solid var(--edge);border-radius:3px;padding:9px 12px;color:var(--ink)}
.lv:not([disabled]):hover{background:#fff}
.lv[disabled]{opacity:.45;cursor:not-allowed}
.lv .n{font-family:var(--display);font-size:20px;text-align:center}
.lv .t{font-weight:800}
.lv .d{font-size:13px;color:var(--ink-soft);display:block;font-weight:500}
.lv .rec{font-family:var(--display);font-size:15px;text-align:right;white-space:nowrap}
.lv .drop{font-size:12px;color:var(--ink-soft)}
.peek{margin-top:14px;font-size:13px;color:var(--ink-soft);line-height:1.9}
.peek .must{color:var(--ink);font-weight:800}
.row-btns{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.btn{border:3px solid var(--edge);background:var(--gold);border-radius:3px;padding:8px 18px;font-weight:800;color:var(--ink);box-shadow:inset -3px -3px 0 rgba(0,0,0,.2)}
.btn.sec{background:#fffaf0}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border-bottom:1px solid #cbbfa9;padding:6px 4px;text-align:left}
.tbl{overflow-x:auto}

/* game */
#game{display:none}
.hud{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-family:var(--display);font-size:17px}
.hud .where{font-size:15px;color:var(--on-dark-soft)}
.hud .vals{display:flex;gap:16px;flex-wrap:wrap}
.hud .m{color:var(--miss)}
.hud #hudBest{color:var(--gold)}
.hud #hudBest.over{color:var(--on-dark-soft)}
.mine{margin-top:14px;border:3px solid var(--edge);border-radius:4px;padding:22px 18px 18px;text-align:center;min-height:400px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;position:relative;overflow:hidden;
  background-color:#3b3530;
  background-image:linear-gradient(45deg,rgba(0,0,0,.18) 25%,transparent 25% 75%,rgba(0,0,0,.18) 75%),linear-gradient(45deg,rgba(0,0,0,.18) 25%,transparent 25% 75%,rgba(0,0,0,.18) 75%);
  background-size:36px 36px;background-position:0 0,18px 18px}
.prompt-ja{font-size:clamp(24px,4.2vw,38px);font-weight:800;line-height:1.35;max-width:24em;text-shadow:2px 2px 0 var(--edge)}
.prompt-en{font-size:clamp(28px,5vw,44px);font-weight:800;text-shadow:2px 2px 0 var(--edge)}
.must-tag{font-size:13px;font-weight:800;background:var(--gold);color:var(--ink);border:2px solid var(--edge);padding:0 10px}
.speak{border:2px solid var(--on-dark-soft);background:rgba(0,0,0,.3);border-radius:3px;padding:4px 12px;font-size:14px;font-weight:700}
.target{position:relative;width:118px;height:118px}
.target .blk{max-width:none;width:118px;transition:transform .08s}
.target .blk.hit{transform:rotate(-4deg) scale(.96)}
.target svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.target svg path{stroke:var(--edge);stroke-width:4;fill:none;stroke-linecap:square;opacity:0;transition:opacity .1s}
.target.broken .blk{animation:breakaway .35s forwards}
@keyframes breakaway{to{transform:scale(.2);opacity:0}}
.bit{position:absolute;width:14px;height:14px;border:2px solid var(--edge);left:52px;top:52px;animation:fly .6s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(200deg);opacity:0}}
.gain{position:absolute;left:50%;top:6px;transform:translateX(-50%);font-family:var(--display);font-size:22px;white-space:nowrap;animation:rise 1s forwards;text-shadow:2px 2px 0 var(--edge)}
@keyframes rise{to{transform:translate(-50%,-34px);opacity:0}}
.slots{display:flex;flex-wrap:wrap;justify-content:center;gap:5px 4px;max-width:100%}
.slot{min-width:30px;height:48px;border-bottom:4px solid #6d645a;font-size:34px;font-weight:800;display:flex;align-items:flex-end;justify-content:center;padding:0 2px;line-height:1.15;color:var(--on-dark)}
.slot.done{border-color:var(--ok)}
.slot.cur{border-color:var(--gold);animation:blink 1s steps(2) infinite}
.slot.hintch{color:#8a8075}
.slot.sp{min-width:18px;border-bottom-style:dotted}
@keyframes blink{50%{border-color:#6d645a}}
.shake{animation:shake .25s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:640px}
.choice{text-align:left;border:3px solid var(--edge);background:var(--panel);color:var(--ink);border-radius:3px;padding:10px 12px;font-size:18px;font-weight:700;display:flex;gap:10px;align-items:center;box-shadow:inset -3px -3px 0 var(--panel2)}
.choice .k{font-family:var(--display);font-size:16px;border:2px solid var(--edge);width:28px;height:28px;display:grid;place-items:center;flex:none;background:#fffaf0}
.choice.good{background:#bfe8c4}
.choice.bad{background:#f5c2c4}
.built{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;min-height:52px;max-width:100%}
.bslot{min-width:56px;height:46px;border-bottom:4px solid #6d645a;font-size:28px;font-weight:800;padding:0 4px;display:flex;align-items:flex-end;justify-content:center}
.bslot.done{border-color:var(--ok)}
.bslot.cur{border-color:var(--gold);animation:blink 1s steps(2) infinite}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;max-width:760px}
.tile{display:flex;align-items:center;gap:8px;border:3px solid var(--edge);background:var(--stone);color:#fff;font-size:22px;font-weight:800;padding:8px 14px;text-shadow:2px 2px 0 var(--edge);box-shadow:inset -4px -4px 0 rgba(0,0,0,.25),inset 4px 4px 0 rgba(255,255,255,.15)}
.tile .k{font-family:var(--display);font-size:13px;background:var(--edge);color:var(--gold);padding:0 5px;text-shadow:none}
.tile:not([disabled]):hover{transform:translateY(-3px)}
.tile.used{visibility:hidden}
.tile.glow{outline:3px solid var(--gold);outline-offset:2px}
.reader{display:grid;gap:6px}
.rline{display:grid;grid-template-columns:96px 1fr;gap:10px;text-align:left;background:#fffaf0;border:2px solid var(--edge);padding:8px 10px;color:var(--ink)}
.rline:hover{background:#fff}
.rline .sp{font-size:13px;color:var(--ink-soft);font-weight:700;padding-top:3px}
.rline .en{display:block;font-size:19px;font-weight:800}
.rline .ja{display:none;font-size:14px;color:var(--ink-soft)}
.showja .rline .ja{display:block}
.flash{font-size:16px;color:var(--on-dark-soft);min-height:26px}
.track{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.track span{width:14px;height:14px;border:2px solid var(--edge);background:#4a433c}
.track span.got{background:var(--stone)}
.help{text-align:center;font-size:13px;color:var(--on-dark-soft);margin-top:10px}
.hero{margin-top:14px;background:var(--panel);color:var(--ink);border:3px solid var(--edge);padding:14px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;box-shadow:inset -5px -5px 0 var(--panel2)}
.hero .what{flex:1;min-width:240px}
.hero .what small{display:block;color:var(--ink-soft);font-size:13px;font-weight:700}
.hero .what b{display:block;font-size:22px;line-height:1.3}
.hero .what span{font-size:14px;color:var(--ink-soft)}
.gobtn{border:3px solid var(--edge);background:var(--gold);color:var(--ink);font-size:20px;font-weight:800;padding:12px 26px;box-shadow:inset -4px -4px 0 rgba(0,0,0,.2);animation:pulse2 1.6s infinite}
.hb.help{background:#fffaf0}
.layer-head{cursor:pointer}
.layer-head .tog{font-size:13px;color:var(--on-dark-soft);margin-left:8px}
.layer.closed .shafts{display:none}
.steps{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 10px}
.step{display:flex;align-items:center;gap:8px;background:#fffaf0;border:2px solid var(--edge);padding:6px 12px;font-weight:800}
.step .n{width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fffaf0;display:grid;place-items:center;font-size:14px;flex:none}
.holding{display:flex;align-items:center;gap:12px;background:#fffaf0;border:3px solid var(--edge);padding:8px 12px;margin-bottom:8px}
.holding i{width:40px;height:40px;border:3px solid var(--edge);display:inline-block;flex:none}
.holding .e{font-size:36px;line-height:1}
.holding b{font-size:18px}
.holding span{font-size:13px;color:var(--ink-soft);display:block}
.bigtool{border:3px solid var(--edge);background:#fffaf0;padding:8px 16px;font-weight:800;font-size:16px}
.bigtool.on{background:var(--ink);color:#fffaf0}
.cell.plan.cur{background:color-mix(in srgb,var(--pc) 45%,transparent);outline:1.5px dashed rgba(255,255,255,.95);outline-offset:-2px}
.cell.plan.other{background:color-mix(in srgb,var(--pc) 14%,transparent);outline:1px dashed rgba(255,255,255,.35);outline-offset:-1px}
.goal{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 8px}
.goal .g{border:2px solid var(--edge);background:#fffaf0;padding:3px 10px;font-size:13px;font-weight:700;color:var(--ink)}
.goal .g.now{background:var(--gold)}
.goal .g.done{background:#bfe8c4}
.bgrid.placing .cell.emp:hover{background:var(--pv);outline:2px solid #fff}
.bgrid.breaking .cell:not(.emp):hover{outline:3px solid var(--miss);opacity:.6}
.pal.cant{opacity:.45}
.helpgrid{display:grid;gap:8px}
.hcard{display:flex;gap:12px;align-items:flex-start;background:#fffaf0;border:2px solid var(--edge);padding:10px 12px}
.hcard .ic{font-size:30px;line-height:1;flex:none;width:40px;text-align:center}
.hcard b{display:block;font-size:16px}
.hcard span{font-size:14px;color:var(--ink-soft);line-height:1.5}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.chip{display:inline-flex;align-items:center;gap:5px;border:2px solid var(--edge);background:#fffaf0;padding:1px 8px;font-size:13px;font-weight:700;color:var(--ink)}
.chip i{width:12px;height:12px;border:2px solid var(--edge);display:inline-block}
.empty-base{position:absolute;left:0;right:0;top:50%;text-align:center;font-weight:800;color:#1b2b4b;text-shadow:0 1px 0 #fff;display:none}
.base{position:relative}
.homebar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.hb{border:3px solid var(--edge);padding:8px 14px;font-weight:800;color:var(--ink);box-shadow:inset -3px -3px 0 rgba(0,0,0,.2);position:relative}
.hb.build{background:var(--gold)}.hb.chest{background:#ffb26b}.hb.dex{background:#9fd8a8}
.hb .badge{position:absolute;top:-10px;right:-10px;background:var(--miss);color:#fff;border:2px solid var(--edge);border-radius:999px;font-size:12px;padding:0 7px;animation:pulse2 1s infinite}
@keyframes pulse2{50%{transform:scale(1.15)}}
.cell .em{display:flex;align-items:center;justify-content:center;width:100%;height:100%;font-size:min(1.2vw,14px);line-height:1}
.sheet.wide{max-width:1100px}
.bgrid{display:grid;grid-template-columns:repeat(64,1fr);grid-template-rows:repeat(16,1fr);aspect-ratio:64/16;width:100%;background:linear-gradient(#6fa9d6,#a9d3ef 70%);border:3px solid var(--edge);touch-action:none;user-select:none;cursor:crosshair}
.bgrid .cell{outline:1px solid rgba(255,255,255,.12);outline-offset:-1px}
.bgrid .cell.plan{outline:1px dashed rgba(255,255,255,.6)}
.bgrid .cell .em{font-size:min(1.3vw,15px)}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
.tool{border:2px solid var(--edge);background:#fffaf0;padding:5px 12px;font-weight:800}
.tool.on{background:var(--ink);color:#fffaf0}
.palette{display:flex;flex-wrap:wrap;gap:6px}
.pal{display:flex;align-items:center;gap:6px;border:2px solid var(--edge);background:#fffaf0;padding:4px 8px;font-size:13px;font-weight:700;color:var(--ink)}
.pal i{width:18px;height:18px;border:2px solid var(--edge);display:inline-block;flex:none}
.pal .e{font-size:18px;line-height:1}
.pal small{color:var(--ink-soft);font-weight:500}
.pal.sel{outline:3px solid var(--miss);outline-offset:1px}
.pal[disabled]{opacity:.45}
.secttl{font-weight:800;margin:12px 0 6px;font-size:14px}
.chestbox{width:120px;height:96px;margin:18px auto 8px;position:relative}
.chestbox .body{position:absolute;left:0;right:0;bottom:0;height:60px;border:4px solid var(--edge);background:var(--cc)}
.chestbox .lid{position:absolute;left:-4px;right:-4px;top:4px;height:36px;border:4px solid var(--edge);background:var(--cc);transform-origin:10% 100%;transition:transform .4s}
.chestbox .lock{position:absolute;left:50%;top:30px;width:18px;height:22px;margin-left:-9px;background:#3b3530;border:3px solid var(--edge);z-index:2}
.chestbox.shake{animation:cshake .5s infinite}
.chestbox.open .lid{transform:rotate(-35deg) translateY(-14px)}
.chestbox.open .lock{display:none}
@keyframes cshake{25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
.prize{font-size:56px;line-height:1.1;margin:6px 0;animation:popin .5s}
.prize i{display:inline-block;width:56px;height:56px;border:4px solid var(--edge)}
@keyframes popin{0%{transform:scale(0)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
.rar{display:inline-block;font-family:var(--display);font-size:20px;padding:2px 14px;border:3px solid var(--edge);color:#fff;text-shadow:1px 1px 0 var(--edge)}
.dexbar{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.dexgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.dcard{border:3px solid #b9ad99;background:#fffaf0;padding:6px 8px;text-align:left;color:var(--ink);min-height:54px}
.dcard b{display:block;font-size:15px}
.dcard span{font-size:12px;color:var(--ink-soft)}
.dcard.l0{border-style:dashed}
.dcard.l1{border-color:var(--copper)}.dcard.l2{border-color:#9a948a;background:#f4f1ec}.dcard.l3{border-color:var(--gold);background:#fff6d6}.dcard.l4{border-color:var(--ruby);background:#ffe6ea}
.dcard.unk{background:#e9e1d2;color:#9a8f7f}
.prog2{height:10px;border:2px solid var(--edge);background:#fffaf0;margin-top:4px}
.prog2 i{display:block;height:100%;background:var(--gold)}
.bosspanel{display:flex;align-items:center;gap:16px;width:100%;max-width:560px}
.bossspr{display:grid;grid-template-columns:repeat(10,8px);grid-template-rows:repeat(10,8px);flex:none;transition:transform .08s}
.bossspr span{width:8px;height:8px}
.bossspr.hit{transform:translateX(6px) rotate(4deg)}
.bossspr.hurt{animation:hurt .4s}
@keyframes hurt{30%{filter:brightness(3)}}
.bossinfo{flex:1;text-align:left}
.bossinfo b{font-family:var(--display);font-size:18px}
.hpbar{height:16px;border:3px solid var(--edge);background:#3b3530;margin:4px 0}
.hpbar i{display:block;height:100%;background:var(--miss);transition:width .3s}
.hearts{font-size:18px;letter-spacing:2px}
.node.bossnode .blk{background-color:#7a2f3a}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--miss);color:#fff;font-weight:800;padding:8px 16px;border:3px solid var(--edge);display:none;z-index:30}
.big{font-family:var(--display);font-size:72px;line-height:1}
.rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.rgrid div{background:#fffaf0;border:2px solid var(--edge);padding:6px}
.rgrid b{display:block;font-family:var(--display);font-size:22px;font-weight:400}
.rgrid span{font-size:12px;color:var(--ink-soft)}
.loot{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:6px 0 10px}
.loot .ore{background:#fffaf0;color:var(--ink)}
.newrec{font-family:var(--display);color:var(--miss);font-size:18px;min-height:24px}
.misslist{font-size:15px;text-align:left;margin:0 auto;max-width:420px}
.mobile-note{display:none;margin-top:12px;font-size:14px;background:var(--bg2);border:2px solid var(--edge);padding:8px 12px}
@media (hover:none) and (pointer:coarse){.mobile-note{display:block}}
@media (max-width:560px){.choices{grid-template-columns:1fr}.slot{font-size:26px;min-width:22px;height:40px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</div>

  add(8,3,"brick");add(8,2,"brick");

    if((x===19||x===20)&&y>=12)continue;

    add(x,y,"cobble")}
  for(const x of [17,19,20,22])add(x,3,"cobble");
  add(20,2,"log");add(20,1,"log");add(21,1,"flag");
  bi=2;// 3: tree & farm

  for(let x=34;x<=39;x++)add(x,14,"path");

  bi=3;// 4: windmill

  for(let x=42;x<=47;x++)add(x,5,"roof"); for(let x=43;x<=46;x++)add(x,4,"roof"); add(44,3,"roof");add(45,3,"roof");
  for(let i=1;i<=4;i++){ add(44-i,6-i,"plank"); add(45+i,6-i,"plank"); add(44-i,6+i,"plank"); add(45+i,6+i,"plank"); }

  const map=new Map();c.forEach((p,i)=>{const k=p.x+","+p.y;if(map.has(k)){c[map.get(k)].m=p.m;c[i]=null}else map.set(k,i)});

   <div class="row-btns"><button class="btn" id="buildClose">できた!</button></div>`;
  const sh=$("buildSheet");

  sh.querySelectorAll("[data-tool]").forEach(b=>b.onclick=()=>{BS.tool=b.dataset.tool;renderBuild()});
  $("planBtn").onclick=()=>{BS.plan=!BS.plan;renderBuild()};
  $("autoBtn").onclick=()=>{BS.auto=!BS.auto;renderBuild()};
  $("buildClose").onclick=()=>{closeModal("buildModal");renderHome()};
  const grid=$("bgrid");
  const act=el=>{if(!el||!el.dataset||!el.dataset.k)return;applyCell(el.dataset.k)};
  grid.onpointerdown=e=>{BS.paint=true;act(e.target.closest(".cell"));e.preventDefault()};
  grid.onpointermove=e=>{if(!BS.paint)return;const el=document.elementFromPoint(e.clientX,e.clientY);act(el&&el.closest&&el.closest(".cell"))};
  window.onpointerup=()=>{BS.paint=false};
}
function applyCell(k){
  const cur=S.build[k];
  if(BS.tool==="break"){if(!cur)return;const[t,id]=cur.split(":");
    if(t==="b")Object.entries(BLOCKS[id].cost).forEach(([o,n])=>S.inv[o]=(S.inv[o]||0)+n);else S.items[id]=(S.items[id]||0)+1;
    delete S.build[k];tone(200,.05);save();refreshCell(k);return}
  if(cur)return;
  let sel=BS.sel;const pv=PLAN.get(k);if(BS.auto&&pv)sel="b:"+pv.blk;
  const[t,id]=sel.split(":");
  if(t==="b"){const c=BLOCKS[id].cost;if(!canPay(c)){const lack=Object.keys(c).find(o=>(S.inv[o]||0)<c[o]);BS.paint=false;toast(`${ORES[lack].n}が足りない! ${ORE_HINT[lack]}掘ると手に入るよ`);return}
    Object.entries(c).forEach(([o,n])=>S.inv[o]-=n)}
  else{if(!(S.items[id]>0)){toast("もうない! 宝箱で集めよう");BS.paint=false;return}S.items[id]--}
  S.build[k]=sel;tone(660,.04);save();refreshCell(k);
  if(pv&&checkBuildingDone()){BS.paint=false;setTimeout(renderBuild,50)}
}
function refreshCell(k){
  const el=document.querySelector(`#bgrid [data-k="${k}"]`);if(!el)return;
  const tmp=document.createElement("div");tmp.innerHTML=cellHTML(S.build[k]).replace('<div class="cell','<div data-k="'+k+'" class="cell');
  const n=tmp.firstChild;n.classList.add("new");el.replaceWith(n);
  const hd=$("holding");if(hd)hd.innerHTML=holdingInfo();
  const gl=$("buildSheet").querySelector(".goal");if(gl){const cb=curBuilding();const{tot,ok}=bpProgress();gl.innerHTML=`<b style="font-size:14px">目標:</b>${BUILDINGS.map((n,i)=>`<span class="g ${ok[i]>=tot[i]?"done":i===cb?"now":""}">${ok[i]>=tot[i]?"✔ ":""}${n} ${ok[i]}/${tot[i]}</span>`).join("")}<span class="sub" style="margin:0">完成ごとに宝箱!</span>`}
  const inv=$("buildSheet").querySelector(".tools .inv");if(inv)inv.innerHTML=Object.entries(ORES).map(([kk,o])=>`<span class="ore" style="background:#fffaf0;color:var(--ink)"><i style="background:${o.c}"></i>${o.n} ${S.inv[kk]||0}</span>`).join("");
  if(BS.sel.startsWith("d:")||BS.tool==="break"){const sel=BS.sel;setTimeout(()=>{if(!BS.paint)renderBuild()},0)}
}

const CHEST={wood:{n:"木の宝箱",c:"#b8875a",w:[70,25,5,0]},iron:{n:"鉄の宝箱",c:"#ddd6cb",w:[45,38,15,2]},gold:{n:"金の宝箱",c:"#f2c230",w:[25,40,28,7]},ruby:{n:"ルビーの宝箱",c:"#e0405a",w:[0,25,50,25]}};
const RAR=["コモン","レア","スーパーレア","ウルトラレア"],RARC=["#8a8f96","#3a7bd5","#a855f7","#e0a800"];
const LOOT=[
 [{ore:"stone",n:6},{ore:"copper",n:4},{deco:"flower"},{deco:"daisy"}],
 [{ore:"iron",n:3},{ore:"gold",n:1},{deco:"lantern"},{deco:"flag"},{deco:"chick"},{deco:"turtle"}],
 [{ore:"gold",n:3},{ore:"ruby",n:1},{deco:"crystal"},{deco:"hedgehog"},{deco:"penguin"},{deco:"fox"}],
 [{ore:"ruby",n:3},{deco:"crown"},{deco:"koala"},{deco:"elephant"},{deco:"kangaroo"}]];
const today=()=>new Date().toLocaleDateString("sv");
function awardStageChest(st,lv,rank){
  const key=today()+"|"+st.id+"|"+lv;const n=S.chestDay[key]||0;
  for(const k of Object.keys(S.chestDay))if(!k.startsWith(today()))delete S.chestDay[k];
  if(n>=3)return `<p class="sub" style="margin:4px 0">このステージ・このLvの宝箱は今日はおしまい(1日3回まで)。ほかのステージで探そう!</p>`;
  S.chestDay[key]=n+1;
  const tier=st.review?"wood":rank==="S"?"gold":rank==="A"?"iron":"wood";
  S.chests.push(tier);
  return `<p style="margin:6px 0;font-weight:800">🎁 ${CHEST[tier].n}を手に入れた! <button class="btn" id="openChestBtn" style="padding:4px 12px">あける</button></p>`+(st.review?"":`<p class="sub" style="margin:0">ランクSなら金の宝箱、Aなら鉄の宝箱が出るよ</p>`);
}
function rollLoot(tier){const w=CHEST[tier].w;let r=Math.random()*100,rar=0;for(let i=0;i<4;i++){if(r<w[i]){rar=i;break}r-=w[i]}
  const list=LOOT[rar];return{rar,item:list[Math.floor(Math.random()*list.length)]}}
function openChests(){
  if(!S.chests.length){$("chestSheet").innerHTML=`<h3>宝箱</h3><p class="sub">宝箱はまだない。ステージをクリアすると出るよ。ランクが高いほどいい宝箱!</p><div class="row-btns" style="justify-content:center"><button class="btn" id="cClose">とじる</button></div>`;$("chestModal").classList.add("on");$("cClose").onclick=()=>closeModal("chestModal");return}
  const tier=S.chests[0];
  $("chestSheet").innerHTML=`<h3>${CHEST[tier].n}</h3><p class="sub">のこり ${S.chests.length}個</p>
    <div class="chestbox" id="cbox" style="--cc:${CHEST[tier].c}"><div class="body"></div><div class="lid"></div><div class="lock"></div></div>
    <div id="cres" style="min-height:120px"></div>
    <div class="row-btns" style="justify-content:center"><button class="btn" id="cOpen">あける!</button><button class="btn sec" id="cClose">あとで</button></div>`;
  $("chestModal").classList.add("on");
  $("cClose").onclick=()=>{closeModal("chestModal");renderHome()};
  $("cOpen").onclick=()=>{
    const b=$("cOpen");b.disabled=true;const box=$("cbox");box.classList.add("shake");tone(300,.1);
    setTimeout(()=>{box.classList.remove("shake");box.classList.add("open");
      S.chests.shift();const{rar,item}=rollLoot(tier);
      let icon,name;
      if(item.ore){S.inv[item.ore]=(S.inv[item.ore]||0)+item.n;icon=`<i style="background:${ORES[item.ore].c}"></i>`;name=`${ORES[item.ore].n} ×${item.n}`}
      else{const isNew=!(S.items[item.deco]>0)&&!Object.values(S.build).includes("d:"+item.deco);S.items[item.deco]=(S.items[item.deco]||0)+1;icon=DECOS[item.deco].e;name=DECOS[item.deco].n+(isNew?" (NEW!)":"")}
      save();
      [523,659,784,1047].slice(0,rar+2).forEach((f,i)=>setTimeout(()=>tone(f,.12),i*110));
      $("cres").innerHTML=`<div class="rar" style="background:${RARC[rar]}">${RAR[rar]}</div><div class="prize">${icon}</div><div style="font-weight:800;font-size:18px">${name}</div>`;
      b.textContent=S.chests.length?"次の宝箱をあける":"おしまい";b.disabled=false;
      b.onclick=()=>{if(S.chests.length)openChests();else{closeModal("chestModal");renderHome()}};
    },900);
  };
}

function layerWords(w){const seen=new Set(),out=[];w.stages.filter(s=>!s.text).forEach(s=>s.items.forEach(i=>{if(!seen.has(i.en)){seen.add(i.en);out.push(i)}}));return out}
function dexStats(){const all=new Map();WORLDS.filter(w=>w.stages).forEach(w=>layerWords(w).forEach(i=>all.set(i.en,i)));
  let seen=0,gold=0;all.forEach((i,en)=>{const d=S.dex[en];if(d){seen++;if(d.lv>=3)gold++}});return{total:all.size,seen,gold}}
function checkDexComplete(){let msg="";
  WORLDS.filter(w=>w.stages).forEach(w=>{if(S.dexDone[w.id])return;const ws=layerWords(w);
    if(ws.every(i=>S.dex[i.en]&&S.dex[i.en].lv>=3)){S.dexDone[w.id]=true;S.chests.push("ruby");msg+=`<p style="font-weight:800;margin:4px 0">📖 地下${w.id}層の図鑑がぜんぶ金枠に! ルビーの宝箱をゲット!</p>`}});return msg}
let dexTab=null;
function openDex(){
  const ws=WORLDS.filter(w=>w.stages);if(dexTab==null)dexTab=ws[0].id;
  const st=dexStats();const w=ws.find(x=>x.id===dexTab);const words=layerWords(w);
  const lvName=["見つけた","銅枠","鉄枠","金枠","ルビー枠"];
  const got=words.filter(i=>S.dex[i.en]).length,goldN=words.filter(i=>S.dex[i.en]&&S.dex[i.en].lv>=3).length;
  $("dexSheet").innerHTML=`<h3>単語図鑑</h3><p class="sub">見つけた単語 ${st.seen}/${st.total}。カードを押すと発音が聞けるよ。</p>
   <div class="chips"><span class="chip">ミスなしでクリアすると枠の色がかわる →</span><span class="chip"><i style="background:var(--copper)"></i>Lv1</span><span class="chip"><i style="background:#9a948a"></i>Lv2</span><span class="chip"><i style="background:var(--gold)"></i>Lv3</span><span class="chip"><i style="background:var(--ruby)"></i>Lv4</span><span class="chip">層ぜんぶ金枠でルビーの宝箱!</span></div>
   <div class="dexbar">${ws.map(x=>`<button class="tool${x.id===dexTab?" on":""}" data-tab="${x.id}">地下${x.id}層${S.dexDone[x.id]?" 👑":""}</button>`).join("")}</div>
   <div style="font-weight:800">地下${w.id}層 ${esc(w.title)}:発見 ${got}/${words.length}・金枠 ${goldN}/${words.length}</div>
   <div class="prog2"><i style="width:${Math.round(goldN/words.length*100)}%"></i></div>
   <div class="dexgrid" style="margin-top:10px">${words.map(i=>{const d=S.dex[i.en];
     return d?`<button class="dcard l${d.lv}" data-say="${esc(i.en)}"><b>${i.must?"★":""}${esc(i.en)}</b><span>${esc(i.ja)}<br>${lvName[d.lv]}</span></button>`
             :`<div class="dcard unk"><b>？？？</b><span>${i.ja.length>8?esc(i.ja.slice(0,8))+"…":esc(i.ja)}</span></div>`}).join("")}</div>
   <div class="row-btns"><button class="btn" id="dClose">とじる</button></div>`;
  $("dexSheet").querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{dexTab=+b.dataset.tab;openDex()});
  $("dexSheet").querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>say(b.dataset.say));
  $("dClose").onclick=()=>closeModal("dexModal");
  $("dexModal").classList.add("on");

   <div class="tbl"><table><tr><th>英語</th><th>意味</th><th>回数</th></tr>${ms.length?ms.map(([e,v])=>`<tr><td>${v.must?"★":""}${esc(e)}</td><td>${esc(v.ja)}</td><td>${v.count}</td></tr>`).join(""):`<tr><td colspan="3">まだありません</td></tr>`}</table></div>
   <div class="row-btns"><button class="btn sec" id="resetBtn">記録をすべて消す</button><button class="btn" id="pClose">とじる</button></div>`;
  $("pClose").onclick=()=>closeModal("parentModal");
  $("resetBtn").onclick=()=>{if(confirm("記録と拠点をすべて消します。よろしいですか?")){S={stages:{},misses:{},log:[],inv:{stone:0,copper:0,iron:0,gold:0,ruby:0},placed:0,build:{},items:{},dex:{},chests:[],chestDay:{},bossWin:{},dexDone:{}};save();lastPlaced=null;closeModal("parentModal");renderHome()}};
  $("parentModal").classList.add("on");
};
document.querySelectorAll(".modal").forEach(m=>m.addEventListener("click",e=>{if(e.target===m&&m.id!=="resultModal")m.classList.remove("on")}));
renderHome();
if(!S.seenHelp)setTimeout(openHelp,300);
</script>
</body>
</html>
