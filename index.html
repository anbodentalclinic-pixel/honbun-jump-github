<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>本文JUMP</title>
<meta name="theme-color" content="#A7E1F8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="本文JUMP">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌱</text></svg>">
<link rel="apple-touch-icon" href="icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#A7E1F8; --sky2:#E3F6FD; --ink:#1D2B45; --muted:#4F6380;
  --panel:#FFFFFF; --panel-edge:#1D2B45;
  --tile:#FFFFFF; --tile-edge:#1D2B45; --tile-ink:#1D2B45;
  --gold:#FFC83D; --gold-edge:#A86F00;
  --qword:#8ED3FF; --qword-edge:#2F77B5;
  --grass:#58B947; --dirt:#8A5A32;
  --ok:#23994A; --ng:#D93B40;
  --pixel:"DotGothic16", "M PLUS Rounded 1c", system-ui, sans-serif;
  --body:"M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", system-ui, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky:#13213F; --sky2:#243A66; --ink:#EAF2FF; --muted:#A9BCDA;
    --panel:#1C2A4B; --panel-edge:#8FB0E0;
    --tile:#F4F7FB; --tile-edge:#0E1830; --tile-ink:#1D2B45;
    --grass:#3F8F35; --dirt:#5E3D22;
  }
}
:root[data-theme="dark"]{
  --sky:#13213F; --sky2:#243A66; --ink:#EAF2FF; --muted:#A9BCDA;
  --panel:#1C2A4B; --panel-edge:#8FB0E0;
  --tile:#F4F7FB; --tile-edge:#0E1830; --tile-ink:#1D2B45;
  --grass:#3F8F35; --dirt:#5E3D22;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;
  background:linear-gradient(180deg,var(--sky) 0%,var(--sky2) 100%) fixed, var(--sky);
  color:var(--ink);font-family:var(--body);font-weight:500;line-height:1.6;
  -webkit-tap-highlight-color:transparent;
}
main{max-width:560px;margin:0 auto;padding:16px 16px 120px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.tile:focus-visible{outline:3px solid #FF7A00;outline-offset:3px}
.ground{position:fixed;left:0;right:0;bottom:0;height:calc(34px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(var(--grass) 0 10px,var(--dirt) 10px);pointer-events:none;z-index:0}
main{position:relative;z-index:1}

/* title / map */
.logo{font-family:var(--pixel);font-size:44px;line-height:1.1;margin:12px 0 2px;letter-spacing:.02em}
.logo .q{display:inline-block;background:var(--gold);color:#1D2B45;border:3px solid var(--gold-edge);
  border-bottom-width:7px;border-radius:6px;padding:0 10px;margin-right:6px;transform:translateY(-4px)}
.lead{margin:0 0 18px;color:var(--muted)}
.path{display:flex;flex-direction:column;gap:12px}
.node{display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  background:var(--panel);border:3px solid var(--panel-edge);border-bottom-width:6px;border-radius:10px;padding:12px 14px}
.node[disabled]{opacity:.5;cursor:not-allowed}
.node .num{flex:none;width:44px;height:44px;display:grid;place-items:center;font-family:var(--pixel);font-size:22px;
  background:var(--gold);color:#1D2B45;border:3px solid var(--gold-edge);border-radius:6px}
.node.boss .num{background:#FF8A8A;border-color:#A8323A}
.node.paper .num{background:#FFFFFF;border-color:#1D2B45}
.node .t{font-weight:800;font-size:17px;display:block}
.node .s{font-size:13px;color:var(--muted);display:block}
.node .stars{margin-left:auto;font-size:18px;letter-spacing:2px;white-space:nowrap}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.small{font-size:13px;color:var(--muted)}
.linkbtn{background:none;border:none;text-decoration:underline;color:var(--muted);padding:4px}

/* hud */
.hud{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.hud .back{background:var(--panel);border:2px solid var(--panel-edge);border-radius:8px;padding:4px 10px;font-size:14px}
.hud .name{font-family:var(--pixel);font-size:18px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud .meta{font-size:14px;white-space:nowrap}
.combo{font-weight:800;color:#E4570F}

/* sign */
.sign{background:var(--panel);border:3px solid var(--panel-edge);border-bottom-width:6px;border-radius:12px;padding:14px 16px;margin-bottom:14px}
.sign .ins{font-size:14px;color:var(--muted);margin:0 0 4px}
.sign .prompt{font-size:22px;font-weight:800;margin:0;line-height:1.4}
.sign .ctx{font-size:16px;margin:6px 0 0;color:var(--muted)}
.badge{display:inline-block;font-size:14px;font-weight:800;border-radius:999px;padding:2px 12px;margin-top:8px;border:2px solid currentColor}
.badge.yes{color:var(--ok)} .badge.no{color:var(--ng)}
.speak{background:none;border:2px solid var(--panel-edge);border-radius:999px;padding:2px 12px;font-size:14px;margin-top:8px;margin-left:6px}

/* rail & tiles */
.rail{min-height:72px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px;border-radius:12px;
  border:3px dashed var(--panel-edge);background:color-mix(in srgb,var(--panel) 55%,transparent);margin-bottom:10px}
.rail.demo{border-style:solid;justify-content:center;min-height:84px}
.rail .empty{color:var(--muted);font-size:14px}
.rail.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.tile{font-family:var(--body);font-weight:800;font-size:20px;color:var(--tile-ink);
  background:var(--tile);border:3px solid var(--tile-edge);border-bottom-width:7px;border-radius:8px;
  padding:6px 14px 4px;min-height:48px;display:inline-flex;align-items:center;user-select:none}
.tile.gold{background:var(--gold);border-color:var(--gold-edge)}
.tile.qw{background:var(--qword);border-color:var(--qword-edge)}
.tile.used{visibility:hidden}
.tile:active{transform:translateY(3px);border-bottom-width:4px}
.tile.flash{animation:flash .9s 2}
.tile.bad{background:#FFD3D3;border-color:var(--ng)}
@keyframes flash{50%{box-shadow:0 0 0 6px #FF7A00}}
.tile.pulse{animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:translateY(-6px)}}
.punct{font-weight:800;font-size:26px;margin-left:-4px}
.pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:60px;margin:6px 0 16px}

.fb{min-height:28px;font-weight:700;margin:0 0 8px;font-size:15px}
.fb.ng{color:var(--ng)} .fb.ok{color:var(--ok)}
.actions{display:flex;gap:10px}
.btn{flex:1;border:3px solid var(--panel-edge);border-bottom-width:6px;border-radius:10px;padding:10px 8px;
  font-weight:800;font-size:16px;background:var(--panel)}
.btn.primary{background:#FF8A1F;color:#fff;border-color:#9C4A00}
.btn.go{background:var(--ok);color:#fff;border-color:#0F5B29}
.btn:active{transform:translateY(3px);border-bottom-width:3px}
.btn[disabled]{opacity:.45}

.win{background:var(--panel);border:3px solid var(--ok);border-bottom-width:6px;border-radius:12px;padding:14px 16px;margin-top:4px}
.win .big{font-size:24px;font-weight:800;margin:4px 0 8px}
.win .say{font-size:15px;margin:0 0 12px}
.pop{font-family:var(--pixel);color:#E4570F;font-size:20px}

/* intro */
.card{background:var(--panel);border:3px solid var(--panel-edge);border-bottom-width:6px;border-radius:12px;padding:16px;margin-bottom:14px}
.card h2{font-family:var(--pixel);font-weight:400;font-size:24px;margin:0 0 6px}
.card p{margin:6px 0}
.ex{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:2px dashed var(--panel-edge);padding:10px 0;font-size:18px;font-weight:800}
.ex:first-of-type{border-top:none}

/* result */
.bigstars{font-size:52px;letter-spacing:6px;text-align:center;margin:10px 0}
.center{text-align:center}

/* modal */
.modal{position:fixed;inset:0;background:rgba(10,20,40,.55);display:grid;place-items:center;padding:16px;z-index:10}
.modal .card{max-width:520px;width:100%}

/* paper */
.pitem{display:flex;gap:12px;align-items:flex-start;border-top:2px dashed var(--panel-edge);padding:12px 0}
.pitem:first-of-type{border-top:none}
.pitem input{width:26px;height:26px;margin-top:2px;flex:none;accent-color:var(--ok)}
.pitem .no{font-family:var(--pixel);margin-right:4px}
.pitem .ans{font-weight:800;margin-top:4px}



.mic{background:#2F77B5;color:#fff;border-color:#163F63}
.mic.on{background:var(--ng);border-color:#7A1B1F;animation:pulse 1s infinite}
.heard{font-size:14px;color:var(--muted);margin:0 0 10px;min-height:1.4em}
.heard.ok{color:var(--ok);font-weight:700}
.pool.locked .tile{opacity:.3;pointer-events:none}
.speak.must{background:#FF8A1F;color:#fff;border-color:#9C4A00;font-weight:800;animation:pulse 1.1s infinite}
.speak.done{border-color:var(--ok);color:var(--ok)}
.warn{background:#FFF1D6;color:#6B4200;border:2px solid #C98A00;border-radius:10px;padding:10px 12px;font-size:14px;margin:0 0 10px}
/* buddy */
.buddy{flex:none;width:64px;height:64px}
.buddy svg{width:100%;height:100%;overflow:visible;animation:bob 2.2s ease-in-out infinite;transform-origin:50% 100%}
.buddy.jump svg{animation:hop .65s cubic-bezier(.3,.7,.3,1)}
.buddy.sad svg{animation:wob .6s}
.buddy.cheer svg{animation:hop .65s cubic-bezier(.3,.7,.3,1) 3}
.buddy .m-sad,.buddy .tear{display:none}
.buddy.sad .m-happy{display:none}
.buddy.sad .m-sad,.buddy.sad .tear{display:inline}
@keyframes bob{50%{transform:translateY(-3px) scaleY(1.03)}}
@keyframes hop{0%{transform:scale(1.1,.85)}35%{transform:translateY(-34px) scale(.95,1.08)}70%{transform:translateY(0) scale(1.1,.88)}100%{transform:none}}
@keyframes wob{25%{transform:rotate(-10deg)}50%{transform:rotate(8deg)}75%{transform:rotate(-4deg)}}
.buddyrow{display:flex;align-items:center;gap:10px;margin:0 0 8px}
.buddyrow .fb{margin:0;flex:1}
.bubble{background:var(--panel);border:2px solid var(--panel-edge);border-radius:12px;padding:6px 12px;font-size:14px;position:relative}
.logorow{display:flex;align-items:flex-end;gap:10px}
.logorow .buddy{width:72px;height:72px;margin-bottom:6px}
.center .buddy{margin:0 auto;width:88px;height:88px}
@media (prefers-reduced-motion: reduce){.buddy svg{animation:none!important}}
@media (prefers-reduced-motion: reduce){
  .tile.pulse,.tile.flash,.rail.shake{animation:none}
}

.prog{font-family:var(--pixel);font-weight:400;font-size:22px;margin:22px 0 4px}
.prog small{font-family:var(--body);font-size:13px;color:var(--muted);display:block}
.partbox{background:color-mix(in srgb,var(--panel) 45%,transparent);border:3px solid var(--panel-edge);border-radius:14px;padding:12px;margin:10px 0 14px}
.partbox h3{margin:0 0 8px;font-size:18px}
.partbox h3 span{font-size:13px;color:var(--muted);font-weight:500;margin-left:6px}
.node.read .num{background:#8ED3FF;border-color:#2F77B5}
.node.locked{opacity:.55}
.lockedprog{background:var(--panel);border:3px dashed var(--panel-edge);border-radius:12px;padding:10px 14px;margin:8px 0;color:var(--muted);font-size:14px}
.choices{display:grid;gap:10px;margin:6px 0 14px}
.opt{text-align:left;background:var(--panel);border:3px solid var(--panel-edge);border-bottom-width:6px;border-radius:10px;padding:12px 14px;font-size:17px;font-weight:700}
.opt[disabled]{opacity:.4}
.opt.good,.opt.bad{opacity:1!important}
.opt.good{background:#C9F2D6;color:#1D2B45;border-color:var(--ok)}
.opt.bad{background:#FFD3D3;color:#1D2B45;border-color:var(--ng)}
.typearea{position:relative;border:3px dashed var(--panel-edge);border-radius:12px;padding:12px 8px;margin-bottom:10px;background:color-mix(in srgb,var(--panel) 55%,transparent)}
.typearea.focus{border-style:solid;border-color:#FF8A1F}
.slots{display:flex;flex-wrap:wrap;justify-content:center;gap:5px 3px;pointer-events:none}
.slot{min-width:16px;height:34px;border-bottom:3px solid var(--muted);font-size:23px;font-weight:800;display:flex;align-items:flex-end;justify-content:center;line-height:1.1}
.slot.sp{min-width:10px;border-bottom-style:dotted}
.slot.done{border-color:var(--ok)}
.slot.cur{border-color:#FF8A1F}
.slot.hint{color:var(--muted);opacity:.7}
.slots.shake{animation:shake .4s}
#kb{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;border:0;background:transparent;color:transparent;caret-color:transparent}
.tapnote{font-size:13px;color:var(--muted);text-align:center;margin:-4px 0 10px}
.besttag{font-weight:800;color:#E4570F}
.besttag.over{color:var(--muted)}
.rl{display:flex;gap:10px;align-items:flex-start;border-top:2px dashed var(--panel-edge);padding:10px 0;text-align:left;width:100%;background:none;border-left:0;border-right:0;border-bottom:0}
.rl:first-of-type{border-top:none}
.rl .sp{font-size:12px;color:var(--muted);font-weight:700;width:74px;flex:none;padding-top:3px}
.rl .e{display:block;font-size:18px;font-weight:800}
.rl .j{display:none;font-size:14px;color:var(--muted)}
.showja .rl .j{display:block}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.rowbtns .btn{flex:none;padding:8px 14px;font-size:15px}
.partbox.concept{background:color-mix(in srgb,#FFF4CC 70%,transparent)}
.node.concept .num{background:#FFF4CC;border-color:#A86F00}
.tile.newtile{animation:newpop .5s}
@keyframes newpop{0%{transform:translateY(-18px) scale(.6);opacity:0}70%{transform:translateY(3px) scale(1.08)}100%{transform:none;opacity:1}}
.blank{display:inline-block;border-bottom:3px solid #FF8A1F;color:#FF8A1F;min-width:48px;text-align:center}
</style>
</head>

    freqs.forEach((f,i)=>{ const o=ac.createOscillator(),g=ac.createGain(); o.type=type; o.frequency.value=f;
      g.gain.setValueAtTime(.07,t+i*dur); g.gain.exponentialRampToValueAtTime(.001,t+(i+1)*dur);
      o.connect(g).connect(ac.destination); o.start(t+i*dur); o.stop(t+(i+1)*dur+.02); }); }catch(e){}
}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let micBlocked=false;
const JPW=new Set(['udon','kitsune','chawan','mushi','tofu','aki','furuse','mao','jenny','miki','jackson','anya','ken','kenya','emily','quokka','quokkas','sydney','savanna']);
function norm(t){
  return t.toLowerCase().replace(/[’‘]/g,"'")
    .replace(/\bisn't\b/g,'is not').replace(/\bdon't\b/g,'do not').replace(/\blet's\b/g,'let us')
    .replace(/\b(it|she|he|who|that|what)'s\b/g,'$1 is').replace(/\bha-ha\b/g,'haha').replace(/\bha ha\b/g,'haha')
    .replace(/[^a-z ]/g,' ').replace(/\s+/g,' ').trim().split(' ').filter(Boolean);
}
function lcs(a,b){ const d=Array(b.length+1).fill(0);
  for(const x of a){ let prev=0; for(let j=1;j<=b.length;j++){ const tmp=d[j]; d[j]= x===b[j-1] ? prev+1 : Math.max(d[j],d[j-1]); prev=tmp; } }
  return d[b.length]; }
function matchScore(heard,target){ const t=norm(target).filter(w=>!JPW.has(w)), h=norm(heard); return t.length ? lcs(t,h)/t.length : 1; }
function listen(target,onRes,onErr){
  const r=new SR(); r.lang='en-US'; r.interimResults=false; r.maxAlternatives=5; let done=false;
  r.onresult=e=>{ done=true; const alts=[...e.results[0]].map(a=>a.transcript);
    let best=alts[0]||'',bs=0; alts.forEach(a=>{ const sc=matchScore(a,target); if(sc>bs){bs=sc;best=a;} }); onRes(best,bs); };
  r.onerror=e=>{ done=true; onErr(e.error); };
  r.onend=()=>{ if(!done) onErr('no-speech'); };
  try{ speechSynthesis.cancel(); r.start(); }catch(e){ onErr('start'); }
  return r;
}

let S={};

function startLevel(q,l){
  const m=LV[l];

  else if(m.type==='words'){ const ws=WORDS[q.id]||[];
    items=[...shuffle(ws).map((w,k)=>({...w,dir:'ej',_id:'e'+k})), ...shuffle(ws).map((w,k)=>({...w,dir:'je',_id:'j'+k}))]; }
  else items=shuffle(q.items).map((it,k)=>({...it,_id:k}));
  S={kind:'part',title:q.name+' '+m.name,q,l,m,queue:items,retried:new Set(),missItems:new Set(),misses:0,combo:0,best:0,mic:0,total:items.length,done:0};

}

}

function fb(text,cls=''){ const f=$('#fb'); if(!f) return; f.className='fb bubble '+cls; f.textContent=text; }
function nextItem(){
  const it=S.queue.shift();
  if(!it) return showResult();
  S.item=it; S.solved=false; S.itemMiss=0;
  if(S.kind==='lesson') return it.q==='choice'?renderConcept():renderPuzzle();
  ({read:renderRead,choice:renderChoice,je:renderJE,puzzle:renderPuzzle,words:renderWord})[S.m.type]();
}
function itemDone(clean){
  const it=S.item;
  if(clean){ S.combo++; S.best=Math.max(S.best,S.combo); }
  else { S.combo=0; S.missItems.add(it._id); if(!S.retried.has(it._id)&&!(S.m&&S.m.type==='read')){ S.retried.add(it._id); S.queue.push({...it}); } }
  S.done=S.total-new Set(S.queue.map(x=>x._id)).size;
}

function micGate(host,text,onNext,lead){
  const strict=save.micRequired, useMic=SR&&!micBlocked;
  host.innerHTML=`
    <div class="win">
      ${lead||''}
      <p class="big">${esc(text)}</p>
      <p class="say">${useMic?'🎤を押して、声に出して言ってみよう。':'声に出して1回言ってみよう。'}</p>

      <div class="actions"><button class="btn" id="again">🔊 お手本</button>
        ${useMic?`<button class="btn mic" id="mic">🎤 言ってみる</button>`: strict?``:`<button class="btn go" id="next">言えた！ 次へ</button>`}</div>
      ${useMic&&!strict?`<p class="center" style="margin:8px 0 0"><button class="linkbtn" id="skip">マイクを使わずに次へ</button></p>`:''}
    </div>`;
  $('#again').onclick=()=>speak(text);
  const heard=$('#heard'), goNext=()=>{ sfx.tap(); onNext(); };
  if(!useMic&&strict){ heard.textContent='この画面ではマイクが使えないので先へ進めません。おうちの人に「マイク必須」をオフにしてもらってね。'; return; }
  if(!useMic){ $('#next').onclick=goNext; return; }
  if(!strict) $('#skip').onclick=goNext;
  let tries=0, rec=null; const mic=$('#mic');
  const toNext=label=>{ mic.classList.remove('on','mic'); mic.classList.add('go'); mic.textContent=label; mic.onclick=goNext; };
  mic.onclick=()=>{
    if(rec) return; mic.classList.add('on'); mic.textContent='聞いてるよ…'; fb('聞いてるよ。どうぞ！');
    rec=listen(text,(said,score)=>{
      rec=null; mic.classList.remove('on');
      const need=tries>=3?0.6:0.8;
      if(score>=need){ S.mic++; sfx.coin(); setBuddy('pb','jump'); heard.className='heard ok'; heard.textContent='聞こえたよ：「'+said+'」'; fb('バッチリ！','ok'); toNext('次へ'); }
      else { tries++; S.itemMiss++; setBuddy('pb','sad'); heard.className='heard'; heard.textContent='「'+(said||'…')+'」に聞こえたよ';
        fb(tries>=2?'おしい！ 🔊お手本を聞いてから、もう1回':'もう一度、ゆっくり言ってみよう','ng');
        if(tries>=3&&!strict) toNext('次へ'); else mic.textContent='🎤 もう一度';
        if(tries===3) heard.textContent+='（次からは少しゆるく判定するよ）'; }
    },err=>{
      rec=null; mic.classList.remove('on');
      if(['not-allowed','service-not-allowed','start','audio-capture'].includes(err)){
        micBlocked=true; heard.className='heard';
        if(strict){ heard.textContent='この画面ではマイクが使えないので先へ進めません。おうちの人に「マイク必須」をオフにしてもらってね。'; mic.remove(); }
        else { heard.textContent='マイクが使えないみたい。声に出して言えたら次へ進もう。'; toNext('言えた！ 次へ'); }
      } else { heard.className='heard'; heard.textContent='声が聞こえなかったよ。ボタンを押してから言ってね。'; mic.textContent='🎤 もう一度'; }
    });
  };
}

/* マイクが使えない環境: 声に出す時間をとってから「言えた!」 */
function selfReport(text,goNext){
  const b=$('#next'); if(!b) return;
  const words=text.split(' ').length, wait=Math.max(2,Math.ceil(words*0.6));
  let left=wait; b.disabled=true; b.textContent=`声に出して言ってね…${left}`;
  $('#heard').className='heard'; $('#heard').textContent='お手本と同じように、はっきり声に出して言おう';
  const t=setInterval(()=>{ left--; if(!document.body.contains(b)){clearInterval(t);return}
    if(left>0) b.textContent=`声に出して言ってね…${left}`;
    else { clearInterval(t); b.disabled=false; b.textContent='言えた！ 次へ'; b.onclick=()=>{ S.mic++; goNext(); }; } },1000);
}

function renderPuzzle(){
  const it=S.item; S.ans=it.en.split(' '); S.picked=[]; S.listened=false;
  let toks=shuffle(S.ans), g=0; while(toks.join(' ')===S.ans.join(' ') && g++<10) toks=shuffle(S.ans);
  S.pool=toks.map((t,i)=>({id:i,t,used:false}));
  app.innerHTML=hud()+`
    <div class="sign"><p class="ins">日本語に合う英文をつくろう</p><p class="prompt">${esc(it.ja)}</p>
      <button class="speak must" id="say">🔊 まず聞く</button></div>
    <div class="rail" id="rail"></div>
    <div class="buddyrow">${buddy('pb')}<p class="fb bubble" id="fb">まず🔊を押して、音声を聞いてね</p></div>
    <div class="pool" id="pool"></div>
    <div id="bottom"><div class="actions">
      <button class="btn" id="hint">ヒント</button><button class="btn" id="clear">リセット</button><button class="btn primary" id="check">チェック</button>
    </div></div>`;
  bindBack();
  $('#say').onclick=()=>{ const b=$('#say'); b.classList.remove('must'); b.textContent='🔊 再生中…';
    speak(it.en,()=>{ b.textContent='🔊 もう一度聞く'; b.classList.add('done');
      if(!S.listened){ S.listened=true; fb('OK！ ブロックを並べてね'); drawTiles(); } }); };
  $('#hint').onclick=hint; $('#clear').onclick=()=>{ S.picked.forEach(id=>S.pool[id].used=false); S.picked=[]; drawTiles(); };
  $('#check').onclick=check;
  if(S.kind==='lesson'){ S.listened=true; const b=$('#say'); b.classList.remove('must'); b.textContent='🔊 聞く(ヒント)'; fb('日本語に合うようにならべよう'); }
  drawTiles(); window.scrollTo(0,0);
}
function drawTiles(){
  const rail=$('#rail'), pool=$('#pool');
  rail.innerHTML = S.picked.length ? S.picked.map((id,i)=>`<button class="tile" data-r="${i}">${esc(S.pool[id].t)}</button>`).join('')
    : '<span class="empty">下のブロックをタップして並べよう</span>';
  pool.classList.toggle('locked',!S.listened);
  const ck=$('#check'); if(ck) ck.disabled=!S.listened;
  pool.innerHTML=S.pool.map(p=>`<button class="tile ${p.used?'used':''}" data-p="${p.id}" ${p.used?'tabindex="-1" aria-hidden="true"':''}>${esc(p.t)}</button>`).join('');
  rail.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{ if(S.solved) return; sfx.tap(); const id=S.picked.splice(+b.dataset.r,1)[0]; S.pool[id].used=false; drawTiles(); });
  pool.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{ if(S.solved||!S.listened) return; const p=S.pool[+b.dataset.p]; if(p.used) return;
    sfx.tap(); p.used=true; S.picked.push(p.id); fb(S.picked.length===S.ans.length?'並べたら「チェック」を押してね':'いいね、その調子'); drawTiles(); });
}
const picked=()=>S.picked.map(id=>S.pool[id].t);
function firstWrong(toks){ let i=0; while(i<toks.length&&i<S.ans.length&&toks[i]===S.ans[i]) i++; return i; }
function hint(){
  if(S.solved||!S.listened) return;
  const toks=picked(), i=firstWrong(toks); S.combo=0; S.itemMiss++;
  if(i<toks.length){ const el=$('#rail').querySelector(`[data-r="${i}"]`); if(el) el.classList.add('bad');
    fb(`${i+1}番目から違うよ。赤いブロックをタップして戻そう`,'ng'); setBuddy('pb','sad'); return; }
  if(i<S.ans.length){ const target=S.pool.find(p=>!p.used&&p.t===S.ans[i]);
    if(target){ const el=$('#pool').querySelector(`[data-p="${target.id}"]`); el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
    fb(`${i+1}番目は光っているブロック`); }
}
function check(){
  if(S.solved) return;
  const toks=picked();
  if(!toks.length){ fb('まずブロックを並べよう','ng'); return; }
  if(toks.join(' ')===S.ans.join(' ')){
    S.solved=true; const clean=S.itemMiss===0; itemDone(clean);
    const text=S.item.en; sfx.coin(); speak(text); fb('やったね！','ok'); setBuddy('pb','jump');
    $('#bottom').innerHTML=`<div class="win"><div class="row"><strong style="color:var(--ok)">正解！</strong>${S.combo>=3?`<span class="pop">${S.combo} コンボ</span>`:''}</div><p class="big">${esc(text)}</p><div class="actions"><button class="btn" id="again">🔊 もう一度</button><button class="btn go" id="next">次へ</button></div></div>`; $('#again').onclick=()=>speak(text); $('#next').onclick=()=>{ sfx.tap(); nextItem(); }; return;
  }
  S.misses++; S.itemMiss++; S.combo=0; sfx.ng(); setBuddy('pb','sad');
  const rail=$('#rail'); rail.classList.remove('shake'); void rail.offsetWidth; rail.classList.add('shake');
  const i=firstWrong(toks);
  if(i>=toks.length && toks.length<S.ans.length) fb(`ここまでは合ってる！ ブロックがまだ足りないよ`,'ng');
  else if(i===0) fb('1番目からちがうよ。🔊でもう一度聞いてみよう','ng');
  else fb(`前から${i}個は合ってる！ ${i+1}番目を見直そう`,'ng');
}

    {t:['Because','elephants','sometimes attack','schoolchildren.'],h:[0],c:'答えは Because で始める。'}],
   quiz:[
    {q:'choice',s:'___ is it dangerous? — Because elephants attack schoolchildren.',o:['Why','What','Who'],a:'Why',e:'理由をたずねる → Why'},
    {q:'choice',s:'Why does Jackson go to school? — ___ he has a dream.',o:['Because','So','And'],a:'Because',e:'理由の答え → Because'},
    {q:'choice',s:'Why ___ you like him?',o:['do','does','is'],a:'do',e:'主語 you → do'},
    {q:'choice',s:'Why ___ Jackson go to school?',o:['do','does'],a:'does',e:'主語 Jackson(三人称・単数)→ does'},
    {q:'order',ja:'なぜジャクソンは学校に行くのですか。',en:'Why does Jackson go to school?'},
    {q:'order',ja:'彼には夢があるからです。',en:'Because he has a dream.'}]}
 ],
 7:[
  {id:'7A',name:'There is / There are',sub:'「〜があります・〜がいます」',
   rule:'1つ(単数)なら There is、2つ以上(複数)なら There are。疑問文は is / are が先頭。',
   demo:[
    {t:['There','is','a famous place','in Sydney.'],h:[1,2],c:'1つ(a famous place)なら is。'},
    {t:['There','are','a lot of unique animals','in Australia.'],h:[1,2],c:'たくさんなら are に切りかわる!'},
    {t:['Are','there','any parks','near your house?'],h:[0],c:'疑問文は are が先頭にジャンプ。'},
    {t:['Yes,','there','are.'],h:[2],c:'答えも there を使う。'}],
   quiz:[
    {q:'choice',s:'There ___ a famous place in Sydney.',o:['is','are'],a:'is',e:'a famous place(1つ)→ is'},
    {q:'choice',s:'There ___ a lot of unique animals in Australia.',o:['is','are'],a:'are',e:'a lot of 〜(たくさん)→ are'},
    {q:'choice',s:'There ___ three parks near my house.',o:['is','are'],a:'are',e:'three parks(3つ)→ are'},
    {q:'choice',s:'There ___ a steak restaurant over there.',o:['is','are'],a:'is',e:'a steak restaurant(1つ)→ is'},
    {q:'choice',s:'___ there a library in your town? — Yes, there is.',o:['Is','Are'],a:'Is',e:'a library(1つ)→ Is'},
    {q:'order',ja:'シドニーに有名な場所があります。',en:'There is a famous place in Sydney.'},
    {q:'order',ja:'オーストラリアにはめずらしい動物がたくさんいます。',en:'There are a lot of unique animals in Australia.'}]},
  {id:'7B',name:'How ～? — By ～.',sub:'「どうやって?」と手段の答え',
   rule:'「どうやって〜?」は How を先頭に。乗り物で答えるときは By(〜で)を使う。',
   demo:[
    {t:['I','can','go','there.'],h:[1],c:'ふつうの文。'},
    {t:['How','can','I','go','there?'],h:[0,1],c:'How を先頭にして、can も前へ!'},
    {t:['By','helicopter','or','seaplane.'],h:[0],c:'乗り物の答えは By 〜。'}],
   quiz:[
    {q:'choice',s:'___ can I go there? — By helicopter.',o:['How','What','Why'],a:'How',e:'方法をたずねる → How'},
    {q:'choice',s:'How do you go to Fukuoka? — ___ plane.',o:['By','On','With'],a:'By',e:'乗り物 → By'},
    {q:'choice',s:'How do you come to school? — I come to school ___ bike.',o:['by','in','at'],a:'by',e:'by bike(自転車で)'},
    {q:'choice',s:'How ___ you go to school?',o:['do','does','are'],a:'do',e:'主語 you → do'},
    {q:'order',ja:'どうやってそこに行けますか。',en:'How can I go there?'},
    {q:'order',ja:'ヘリコプターか水上飛行機でです。',en:'By helicopter or seaplane.'}]}
 ]
};
const findLesson=id=>{for(const k in LESSONS)for(const L of LESSONS[k])if(L.id===id)return L};
function startLesson(L){
  S={kind:'lesson',L,title:L.name,queue:shuffle(L.quiz).map((it,k)=>({...it,_id:k})),retried:new Set(),missItems:new Set(),misses:0,combo:0,best:0,mic:0,total:L.quiz.length,done:0};
  showDemo(L,0);
}
function showDemo(L,i){
  const st=L.demo[i], prev=i>0?L.demo[i-1].t:[];
  const sent=st.t.join(' ');
  app.innerHTML=`<div class="hud"><button class="back" id="back">マップ</button><span class="name">${esc(L.name)}</span><span class="meta">しくみ ${i+1}/${L.demo.length}</span></div>
   <div class="card"><h2>${esc(L.name)}</h2><p class="small">${esc(L.sub)}</p>
     <div class="rail demo" id="drail">${st.t.map((w,j)=>`<span class="tile ${st.h.includes(j)?'gold':''} ${prev.includes(w)?'':'newtile'}">${esc(w)}</span>`).join('')}</div>
     <div class="buddyrow">${buddy('db')}<p class="fb bubble" style="font-size:16px">${esc(st.c)}</p></div>
     <div class="actions"><button class="btn" id="dsay">🔊 聞く</button><button class="btn primary" id="dnext">${i<L.demo.length-1?'つぎへ ▶':'ルールのまとめへ ▶'}</button></div>
   </div>`;
  bindBack(); setBuddy('db', i?'jump':''); speak(sent.replace(/ — /g,', '));
  $('#dsay').onclick=()=>speak(sent);
  $('#dnext').onclick=()=>{ sfx.tap(); if(i<L.demo.length-1) showDemo(L,i+1); else showRule(L); };
  window.scrollTo(0,0);
}
function showRule(L){
  app.innerHTML=`<div class="hud"><button class="back" id="back">マップ</button><span class="name">${esc(L.name)}</span></div>
   <div class="card center">${buddy('rb2','cheer')}<h2>ルールのまとめ</h2><p style="font-size:18px;font-weight:700;line-height:1.7;text-align:left">${esc(L.rule)}</p></div>
   <div class="actions"><button class="btn" id="redo">しくみをもう一度</button><button class="btn go" id="qgo">問題にチャレンジ ▶</button></div>`;
  bindBack();
  $('#redo').onclick=()=>showDemo(L,0);
  $('#qgo').onclick=()=>{ sfx.tap(); nextItem(); };
  window.scrollTo(0,0);
}
function fillBlank(s,a){ return s.replace(/\s*\(.*?\)\s*$/,'').replace('___',a); }
function renderConcept(){
  const it=S.item, opts=shuffle(it.o);
  const shown=esc(it.s).replace('___','<span class="blank">　?　</span>');
  app.innerHTML=hud()+`
    <div class="sign"><p class="ins">( ? )に入るものをえらぼう</p><p class="prompt" style="font-size:20px">${shown}</p></div>
    <div class="buddyrow">${buddy('pb')}<p class="fb bubble" id="fb">ルールを思い出してね</p></div>
    <div class="choices">${opts.map((o,i)=>`<button class="opt" data-i="${i}" style="font-size:20px;text-align:center">${esc(o)}</button>`).join('')}</div>
    <div id="bottom"></div>`;
  bindBack();
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    if(S.solved) return; S.solved=true;
    const ok=opts[+b.dataset.i]===it.a;
    app.querySelectorAll('.opt').forEach((o,j)=>{ if(opts[j]===it.a) o.classList.add('good'); o.disabled=true; });
    const full=fillBlank(it.s,it.a);
    if(ok){ sfx.coin(); setBuddy('pb','jump'); fb('正解！ '+it.e,'ok'); }
    else { b.classList.add('bad'); S.misses++; sfx.ng(); setBuddy('pb','sad'); fb('おしい！ '+it.e,'ng'); }
    itemDone(ok); speak(full);
    $('#bottom').innerHTML=`<div class="win"><p class="big">${esc(full)}</p><div class="actions"><button class="btn" id="again">🔊 もう一度</button><button class="btn go" id="next">次へ</button></div></div>`;
    $('#again').onclick=()=>speak(full); $('#next').onclick=()=>{ sfx.tap(); nextItem(); };
  });
  window.scrollTo(0,0);
}

/* ---------- result ---------- */
function showResult(){
  const mi=S.missItems.size, n= mi===0?3 : mi<=2?2 : 1;
  if(S.kind==='lesson'){ const L=S.L, prev=save.lessons[L.id]; save.lessons[L.id]={stars:Math.max(prev?prev.stars:0,n)}; persist(); sfx.fan();
    const sib=Object.values(LESSONS).find(a=>a.some(x=>x.id===L.id)), nx=sib[sib.indexOf(L)+1];
    app.innerHTML=`<div class="card center">${buddy('rb','cheer')}<h2>${esc(L.name)} クリア</h2><div class="bigstars">${starStr(n)}</div>
      <p>${n===3?'ノーミス! ルールはばっちり。':n===2?'いいね。あと少し。':'クリア! もう一度やるとルールが身につくよ。'}</p>
      <p class="small" style="text-align:left;background:#fffaf0;border-radius:10px;padding:10px">${esc(L.rule)}</p></div>
      <div class="actions"><button class="btn" id="retry">もう一度</button>${nx?`<button class="btn go" id="to">次：${esc(nx.name)}</button>`:`<button class="btn go" id="to">本文へ進む</button>`}</div>
      <p class="center"><button class="linkbtn" id="map">マップへ戻る</button></p>`;
    $('#retry').onclick=()=>startLesson(L); $('#to').onclick=()=> nx? startLesson(nx) : showMap(); $('#map').onclick=showMap; window.scrollTo(0,0); return; }
  const pp=P(S.q.id), prev=pp.lv[S.l];
  pp.lv[S.l]={stars:Math.max(prev?prev.stars:0,n)}; persist(); sfx.fan();
  const msg= n===3?'ノーミス！ 完ぺき。': n===2?'いいね。あと少しでノーミス。':'クリア！ もう一度やると星が増えるかも。';
  const nx=S.l<MAXLV, q=S.q, l=S.l;
  app.innerHTML=`
    <div class="card center">${buddy('rb','cheer')}
      <h2>${q.name} ${LV[l].name} クリア</h2>
      <div class="bigstars">${starStr(n)}</div>
      <p>${msg}${!prev?'<br><span class="pop">初クリア！</span>':''}</p>
      <p class="small">ミス ${S.misses}回　最大コンボ ${S.best}${S.mic?`　音読 ${S.mic}回`:''}</p>
    </div>
    <div class="actions"><button class="btn" id="retry">もう一度</button>
      ${nx?`<button class="btn go" id="to">次：${LV[l+1].name}</button>`:`<button class="btn go" id="to">紙ミッションへ</button>`}</div>
    <p class="center"><button class="linkbtn" id="map">マップへ戻る</button></p>`;
  $('#retry').onclick=()=>startLevel(q,l);
  $('#to').onclick=()=> nx? startLevel(q,l+1) : showPaper(q);
  $('#map').onclick=showMap;
  window.scrollTo(0,0);
}

/* ---------- paper ---------- */
function showPaper(q){
  const pp=P(q.id);
  app.innerHTML=`
    <div class="hud"><button class="back" id="back">マップ</button><span class="name">${q.name} 紙ミッション</span></div>
    <div class="card"><h2>ノートに書こう</h2>
      <p class="small">日本語を見て、ノートに英文を書く。単語と単語の間はちゃんと空けよう。書けたら「答えを見る」で丸つけして、チェック。</p>
      ${q.items.map((it,i)=>`<label class="pitem"><input type="checkbox" data-i="${i}" ${pp.paper[i]?'checked':''}>
        <span><span class="no">${i+1}</span>${esc(it.ja)}<span class="ans" hidden id="a${i}">${esc(it.en)}</span><br>
        <button type="button" class="linkbtn" data-show="${i}">答えを見る</button></span></label>`).join('')}
    </div><p class="center small" id="pdone"></p>`;
  $('#back').onclick=showMap;
  const upd=()=>{ const c=q.items.filter((_,i)=>pp.paper[i]).length; $('#pdone').textContent= c===q.items.length?'全部できた！ おつかれさま。':`${c} / ${q.items.length}`; };
  app.querySelectorAll('input[type=checkbox]').forEach(cb=>cb.onchange=()=>{ pp.paper[cb.dataset.i]=cb.checked; persist(); if(cb.checked) sfx.coin(); upd(); });
  app.querySelectorAll('[data-show]').forEach(b=>b.onclick=e=>{ e.preventDefault(); const a=$('#a'+b.dataset.show); a.hidden=false; b.remove(); speak(a.textContent); });
  upd(); window.scrollTo(0,0);
}

if('speechSynthesis' in window){ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged=()=>{}; }
showMap();
</script>
